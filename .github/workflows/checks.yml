name: Editor checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  model-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: node --test tests/model.test.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
