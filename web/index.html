<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>tw Map Editor · 地圖編輯器</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/examples/jsm/"}}</script><style>.asset-visual{height:72px}.asset-visual:after{display:none}.asset-visual img{width:100%;height:100%;object-fit:contain}</style></head>
<body>
<header><div class="brand"><b class="brand-mark">◈</b><div><strong>tw Map Editor</strong><span>等角地圖 · GLB 模組 · 868 通行規則</span></div></div><div class="top-actions"><button id="new">新建</button><button id="template">河岸範例</button><button id="import">匯入</button><button id="save">保存專案</button><button class="primary" id="export">匯出地圖包 ↗</button></div></header>
<main>
<aside class="library"><div class="panel-heading"><span class="eyebrow">素材庫</span><b id="assetCount">4 模組</b></div><input id="search" placeholder="搜尋河岸、岩石、河床…" aria-label="搜尋素材"><div id="assets"></div><div class="source-note"><b>來源已連接</b><p>GLB 模型與來源摘要。自製範例可直接編輯，也可匯入本機素材庫。</p><button id="source">查看來源紀錄</button></div><div class="layer-heading">場景物件 <span id="objectCount"></span></div><div id="objects"></div></aside>
<section class="workspace"><div class="map-bar"><div><span class="dot"></span><b id="mapTitle">新地圖・河岸</b><span id="mapSize"></span></div><span id="saveState">本機草稿</span></div>
<div class="toolbar" role="toolbar" aria-label="地圖編輯工具"><div id="tools"><button data-tool="select" class="active" title="選取與拖移 (V)">↖ 選取</button><button data-tool="terrain" title="放置素材 (T)">▧ 地形</button><button data-tool="walk" title="塗可通行格 (W)">◌ 通行</button><button data-tool="block" title="塗阻擋格 (B)">▨ 阻擋</button><button data-tool="spawn">⚑ 出生</button><button data-tool="portal">⇥ 出口</button><button data-tool="npc">♙ NPC</button><button data-tool="monster">♟ 怪物</button><button data-tool="test">▷ 試走</button></div><div class="history"><button id="undo" title="復原 Ctrl+Z">↶</button><button id="redo" title="重做 Ctrl+Y">↷</button></div></div>
<div id="viewport"><canvas id="scene" aria-label="等角地圖編輯畫布"></canvas><div class="view-controls"><button id="iso" class="active">等角</button><button id="top">俯視</button><button id="fit">置中</button><label><input type="checkbox" id="grid" checked>格線</label><label><input type="checkbox" id="collision">通行層</label><label><input type="checkbox" id="props" checked>物件</label></div><div id="loading">正在讀取地圖素材…</div><div class="canvas-caption"><span id="toolHint">選取物件後拖移 · 滾輪縮放 · 右鍵平移</span><span class="rule-badge">868 · 4 單位／格 · 0x02 阻擋</span></div></div>
<footer><span id="coords">座標 —</span><span id="stats"></span><button id="rebuild">重算地形通行區</button><button id="validate">檢查地圖</button></footer></section>
<aside class="inspector"><span class="eyebrow">地圖設定</span><label>地圖名稱<input id="name" maxlength="120"></label><label>新地圖編號<input id="mapId" maxlength="80"></label><div class="inline"><label>寬度（格）<input id="width" type="number" min="8" max="1024"></label><label>高度（格）<input id="height" type="number" min="8" max="1024"></label></div><button id="resize">套用尺寸</button><p id="mapExtent" class="muted small"></p><div class="divider"></div><span class="eyebrow">筆刷與對位</span><label>筆刷尺寸<select id="brush"><option value="1">1 格</option><option value="2">3 × 3 格</option><option value="3">5 × 5 格</option><option value="5">9 × 9 格</option></select></label><label>吸附<select id="snap"><option value="1">通行格（0.25m）</option><option value="10">地形槽（2.5m）</option></select></label><div class="divider"></div><span class="eyebrow">所選物件</span><div id="selection"><p class="muted">點選畫布或場景清單中的物件</p></div><div class="divider"></div><button id="png">匯出等角 PNG</button><p class="muted small">專案儲存在獨立 maps 資料夾。出生點、出口、NPC 與怪物為新地圖設計資料；接入遊戲後才有實際行為。</p><p class="status-label">編輯器預覽 · 尚未接入遊戲</p></aside>
</main><div id="toast" role="status"></div><input type="file" id="file" accept=".json,.twmap" hidden><dialog id="info"><div class="dialog-head"><h2 id="infoTitle"></h2><button id="closeInfo">✕</button></div><div id="infoBody"></div></dialog>
<script type="module" src="app.mjs"></script></body></html>
